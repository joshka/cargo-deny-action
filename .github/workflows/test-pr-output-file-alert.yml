name: Test output-file PR alert

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: joshka/cargo-deny-action@joshka/output-file
        id: cargo-deny
        continue-on-error: true
        with:
          arguments: --format sarif --all-features
          command: check
          command-arguments: --config deny.toml bans
          output-file: cargo-deny.sarif

      - name: Check and normalize SARIF
        run: |
          test "${{ steps.cargo-deny.outputs.output-file }}" = "cargo-deny.sarif"
          test -s cargo-deny.sarif
          grep '"version": "2.1.0"' cargo-deny.sarif
          grep '"b:banned"' cargo-deny.sarif
          sed -i 's#file:///github/workspace/##g' cargo-deny.sarif
          grep '"uri": "deny.toml"' cargo-deny.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: cargo-deny.sarif

      - name: Fail after SARIF upload
        run: |
          echo "cargo-deny produced the expected finding for this validation PR"
          exit 1
